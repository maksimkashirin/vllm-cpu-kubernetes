apiVersion: v1
kind: Pod
metadata:
  name: pvc-cache-loader
  namespace: kaspersky-ml
spec:
  restartPolicy: Never

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: loader
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 36000"]

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

      volumeMounts:
        - name: model-cache
          mountPath: /models

  volumes:
    - name: model-cache
      persistentVolumeClaim:
        claimName: model-cache
