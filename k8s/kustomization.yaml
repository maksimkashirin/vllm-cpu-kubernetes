apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kaspersky-ml

resources:
  - 00-namespace.json
  - 01-pvc.yaml
  - 05-deployment.json
  - 06-service.json

configMapGenerator:
  - name: kaspersky-vllm-config
    files:
      - serve.yaml

generatorOptions:
  disableNameSuffixHash: true
